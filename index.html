<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Salita de Ensayo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fffbf0;color:#1f2937;}
button{cursor:pointer;border:none;font-family:inherit;}
input,textarea,select{font-family:inherit;}
textarea{resize:none;}
.app{min-height:100vh;background:#fffbf0;}
/* Header */
.header{background:#78350f;color:white;padding:20px 16px 16px;}
.header-inner{max-width:560px;margin:0 auto;}
.header-emoji{font-size:28px;margin-bottom:4px;}
.header h1{font-size:24px;font-weight:800;color:#fef3c7;}
.header p{font-size:13px;color:#fcd34d;margin-top:2px;}
/* Ficha header */
.ficha-header{background:#78350f;color:white;padding:12px 16px;position:sticky;top:0;z-index:100;}
.ficha-header-inner{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px;}
.btn-back{background:none;color:#fcd34d;font-size:22px;padding:0 4px;}
.ficha-header-text{flex:1;min-width:0;}
.ficha-header-text h1{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.btn-edit{background:rgba(255,255,255,0.15);color:white;border:1px solid rgba(255,255,255,0.3);padding:6px 16px;border-radius:12px;font-size:14px;}
.btn-save{background:#f59e0b;color:white;padding:6px 16px;border-radius:12px;font-size:14px;font-weight:700;}
/* Estado badge */
.badge{display:inline-block;font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px;}
.badge-idea{background:#f3f4f6;color:#6b7280;}
.badge-dev{background:#fef9c3;color:#a16207;}
.badge-almost{background:#dbeafe;color:#1d4ed8;}
.badge-done{background:#d1fae5;color:#065f46;}
/* Main content */
.content{max-width:560px;margin:0 auto;padding:16px;}
/* Tarjeta canción */
.song-card{background:white;border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,0.08);cursor:pointer;border:2px solid transparent;transition:border-color 0.2s,box-shadow 0.2s;}
.song-card:active{border-color:#f59e0b;box-shadow:0 2px 8px rgba(0,0,0,0.12);}
.song-card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;gap:8px;}
.song-card-top h3{font-size:16px;font-weight:700;color:#1f2937;}
.song-meta{display:flex;gap:12px;font-size:12px;color:#9ca3af;margin-bottom:8px;flex-wrap:wrap;}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
.tag{background:#fef3c7;color:#92400e;font-size:11px;padding:3px 10px;border-radius:20px;font-weight:500;}
.song-falta{font-size:12px;color:#9ca3af;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
/* Botón nuevo */
.btn-new{width:100%;background:#f59e0b;color:white;border-radius:20px;padding:14px;font-size:16px;font-weight:700;margin-bottom:12px;}
.btn-new:active{background:#d97706;}
/* Filtros */
.filtros{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none;}
.filtros::-webkit-scrollbar{display:none;}
.filtro-btn{white-space:nowrap;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;border:1.5px solid #e5e7eb;background:white;color:#6b7280;}
.filtro-btn.active{background:#f59e0b;color:white;border-color:#f59e0b;}
/* Input nueva canción */
.nueva-input-row{background:white;border-radius:20px;padding:12px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,0.08);display:flex;gap:8px;}
.nueva-input-row input{flex:1;border:1.5px solid #e5e7eb;border-radius:12px;padding:8px 12px;font-size:14px;outline:none;}
.nueva-input-row input:focus{border-color:#f59e0b;}
.btn-crear{background:#f59e0b;color:white;border-radius:12px;padding:8px 16px;font-size:14px;font-weight:700;}
.btn-cancelar{background:white;color:#9ca3af;border:1.5px solid #e5e7eb;border-radius:12px;padding:8px 12px;font-size:14px;}
/* Ficha secciones */
.ficha-section{background:#fffbf0;border-radius:20px;padding:16px;margin-bottom:16px;}
.ficha-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.ficha-grid.full{grid-template-columns:1fr;}
.field-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:#9ca3af;margin-bottom:4px;display:block;}
.field-value{font-size:14px;color:#1f2937;line-height:1.5;white-space:pre-wrap;}
.field-empty{color:#d1d5db;font-style:italic;}
.field-input{width:100%;border:1.5px solid #e5e7eb;border-radius:12px;padding:8px 12px;font-size:14px;background:white;outline:none;}
.field-input:focus{border-color:#f59e0b;}
.field-select{width:100%;border:1.5px solid #e5e7eb;border-radius:12px;padding:8px 12px;font-size:14px;background:white;outline:none;}
.field-textarea{width:100%;border:1.5px solid #e5e7eb;border-radius:12px;padding:8px 12px;font-size:14px;background:white;outline:none;line-height:1.5;}
.field-textarea:focus{border-color:#f59e0b;}
/* Stats básicos */
.stats-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center;}
.stat-item .stat-label{font-size:11px;font-weight:700;text-transform:uppercase;color:#9ca3af;}
.stat-item .stat-val{font-size:14px;font-weight:600;color:#1f2937;margin-top:2px;}
/* Instrumentos */
.instr-cat{font-size:11px;font-weight:700;color:#9ca3af;text-transform:uppercase;margin-bottom:6px;margin-top:8px;}
.instr-tags{display:flex;flex-wrap:wrap;gap:6px;}
.instr-btn{font-size:12px;padding:6px 12px;border-radius:20px;border:1.5px solid #e5e7eb;background:white;color:#6b7280;font-weight:500;}
.instr-btn.active{background:#f59e0b;color:white;border-color:#f59e0b;}
.instr-add-row{display:flex;gap:8px;margin-top:8px;}
.instr-add-row input{flex:1;border:1.5px solid #e5e7eb;border-radius:12px;padding:6px 12px;font-size:13px;outline:none;}
.instr-add-row button{background:#f59e0b;color:white;border-radius:12px;padding:6px 14px;font-size:13px;font-weight:700;}
/* Letra cifrada */
.letra-wrap{font-size:14px;line-height:2;}
.letra-linea{display:flex;flex-wrap:wrap;align-items:flex-end;margin-bottom:6px;}
.letra-grupo{display:inline-flex;flex-direction:column;align-items:flex-start;margin-right:1px;}
.letra-acorde{font-size:12px;font-weight:700;color:#d97706;line-height:1;min-height:14px;margin-bottom:2px;}
.letra-texto{font-size:14px;color:#1f2937;white-space:pre;}
.letra-plain{font-size:14px;color:#1f2937;}
/* Editor acorde */
.acorde-bar{display:flex;gap:8px;align-items:center;background:#fef9c3;border:1.5px solid #fde68a;border-radius:12px;padding:8px 12px;margin-bottom:6px;}
.acorde-bar span{font-size:12px;font-weight:600;color:#92400e;white-space:nowrap;}
.acorde-bar input{flex:1;background:transparent;border:none;outline:none;font-size:14px;color:#1f2937;min-width:0;}
.acorde-bar button{background:#f59e0b;color:white;border-radius:8px;padding:4px 12px;font-size:13px;font-weight:700;}
.acorde-hint{font-size:11px;color:#9ca3af;margin-bottom:6px;padding:0 2px;}
/* Letra/acorde header row */
.letra-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.btn-modo{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;border:1.5px solid #e5e7eb;background:white;color:#6b7280;}
.btn-modo.active{background:#f59e0b;color:white;border-color:#f59e0b;}
/* Audio */
.audio-iframe{width:100%;height:120px;border:none;border-radius:12px;display:block;margin-top:8px;}
/* Divider */
.divider{border:none;border-top:1.5px solid #f3f4f6;margin:16px 0;}
/* Guardar grande */
.btn-guardar-big{width:100%;background:#f59e0b;color:white;border-radius:20px;padding:14px;font-size:16px;font-weight:700;margin-top:8px;margin-bottom:16px;}
/* Eliminar */
.eliminar-zone{margin-top:16px;border-top:1.5px solid #f3f4f6;padding-top:16px;}
.btn-eliminar{width:100%;background:none;color:#fca5a5;font-size:14px;padding:8px;}
.confirm-box{background:#fff5f5;border-radius:16px;padding:16px;text-align:center;}
.confirm-box p{font-size:14px;color:#b91c1c;font-weight:500;margin-bottom:12px;}
.confirm-row{display:flex;gap:8px;justify-content:center;}
.btn-confirm-yes{background:#ef4444;color:white;border-radius:12px;padding:8px 20px;font-size:14px;font-weight:600;}
.btn-confirm-no{background:white;color:#6b7280;border:1.5px solid #e5e7eb;border-radius:12px;padding:8px 20px;font-size:14px;}
.empty-msg{text-align:center;color:#9ca3af;font-size:14px;padding:32px 0;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect}=React;

const NOTAS=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const ALIAS={"Db":"C#","Eb":"D#","Gb":"F#","Ab":"G#","Bb":"A#"};
function transponerAcorde(a,st){
  const m=a.match(/^([A-G][b#]?)(.*)$/);if(!m)return a;
  const[,r,s]=m;const n=ALIAS[r]||r;const i=NOTAS.indexOf(n);
  if(i===-1)return a;return NOTAS[(i+st+12)%12]+s;
}
function transponerTexto(txt,st){
  return txt.replace(/\[([^\]]+)\]/g,(_,a)=>`[${transponerAcorde(a,st)}]`);
}

const ESTADOS=["Idea","En desarrollo","Casi lista","Terminada"];
const BADGE={
  "Idea":"badge badge-idea","En desarrollo":"badge badge-dev",
  "Casi lista":"badge badge-almost","Terminada":"badge badge-done"
};
const CATS={
  "Voces":["Voz principal","Segunda voz"],
  "Cuerdas":["Guitarra de palo","Guitarra eléctrica","Guitalele","Ukelele"],
  "Bajos":["Bajo","Ubass"],
  "Teclados / Viento":["Teclado","Acordeón"],
  "Percusión":["Cajón peruano","Batería tradicional","Jamblock","Cencerro","Djembe","Bongo","Conga"]
};
const TODOS_INSTR=Object.values(CATS).flat();
const FICHA_VACIA={nombre:"",estado:"Idea",estilo:"",tempo:"",tonalidad:"",instrumentos:[],letra:"",audioUrl:"",queFalta:"",notasEnsayo:""};
const DEFAULT=[
  {id:1,nombre:"El río no espera",estado:"En desarrollo",estilo:"Cumbia",tempo:"92 BPM",tonalidad:"Am",
   instrumentos:["Voz principal","Guitarra de palo","Bajo","Acordeón","Cajón peruano","Jamblock"],
   letra:"[Am]El río no es[G]pera, compadre,\nlas [F]aguas no vuelven ja[E]más.\nLo que se [Am]fue con la co[G]rriente\nno hay [F]forma de recu[E]perar.\n\nCoro:\n¡Ay, [F]río! ¡Ay, [G]vida!\nCorre sin pa[Am]rar.\nLo que hoy es [E]tuyo\nma[Am]ñana se irá.",
   audioUrl:"",queFalta:"Grabar maqueta de voz. Definir entrada del acordeón en el puente.",
   notasEnsayo:"Marco propone subir medio tono el coro. Adolfo trae propuesta de acordeón para el jueves."},
  {id:2,nombre:"Lluvia de lunes",estado:"Idea",estilo:"Balada",tempo:"75 BPM",tonalidad:"G",
   instrumentos:["Voz principal","Guitarra de palo"],
   letra:"[G]La lluvia de los [Em]lunes\nme [C]habla de [D]ti.\n[G]Cada gota en el [Em]vidrio\nes un qui[D]zás...",
   audioUrl:"",queFalta:"Completar letra. Definir si entra bajo.",
   notasEnsayo:"Surgió en el ensayo del 20 mayo. Paulo tiene la melodía del coro."}
];

function cargar(k,fb){try{const v=localStorage.getItem(k);return v?JSON.parse(v):fb;}catch{return fb;}}
function guardar(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}

function LetraCifrada({texto}){
  if(!texto)return <span className="field-empty">—</span>;
  return(
    <div className="letra-wrap">
      {texto.split("\n").map((linea,li)=>{
        if(!linea.includes("["))return <div key={li} className="letra-plain">{linea||"\u00A0"}</div>;
        const tokens=[];let i=0;
        while(i<linea.length){
          if(linea[i]==="["){const e=linea.indexOf("]",i);if(e!==-1){tokens.push({t:"a",v:linea.slice(i+1,e)});i=e+1;}else{tokens.push({t:"x",v:linea[i]});i++;}}
          else{let j=i;while(j<linea.length&&linea[j]!=="[")j++;tokens.push({t:"x",v:linea.slice(i,j)});i=j;}
        }
        const grupos=[];let k=0;
        while(k<tokens.length){
          if(tokens[k].t==="a"){const a=tokens[k].v;const tx=tokens[k+1]?.t==="x"?tokens[k+1].v:"";grupos.push({a,tx});k+=tokens[k+1]?.t==="x"?2:1;}
          else{grupos.push({a:null,tx:tokens[k].v});k++;}
        }
        return(
          <div key={li} className="letra-linea">
            {grupos.map((g,gi)=>(
              <span key={gi} className="letra-grupo">
                <span className="letra-acorde">{g.a||""}</span>
                <span className="letra-texto">{g.tx}</span>
              </span>
            ))}
          </div>
        );
      })}
    </div>
  );
}

function EditorLetra({value,onChange}){
  const[ac,setAc]=useState("");
  const insertar=()=>{
    if(!ac.trim())return;
    const ta=document.getElementById("el");if(!ta)return;
    const p=ta.selectionStart;
    onChange(value.slice(0,p)+`[${ac.trim()}]`+value.slice(p));
    setAc("");setTimeout(()=>{ta.focus();ta.selectionStart=ta.selectionEnd=p+ac.trim().length+2;},0);
  };
  return(
    <div>
      <div className="acorde-bar">
        <span>Insertar acorde:</span>
        <input value={ac} onChange={e=>setAc(e.target.value)} onKeyDown={e=>e.key==="Enter"&&insertar()} placeholder="Am, G7..." maxLength={6}/>
        <button onClick={insertar}>↵</button>
      </div>
      <p className="acorde-hint">Posiciona el cursor en la sílaba, escribe el acorde y presiona ↵. O escribe [Am] directo.</p>
      <textarea id="el" value={value} onChange={e=>onChange(e.target.value)} rows={10}
        placeholder={"Escribe la letra.\nUsa [Am] antes de la sílaba donde cae el acorde.\nEjemplo: [Am]El río no es[G]pera"}
        className="field-textarea" style={{fontFamily:"monospace"}}/>
    </div>
  );
}

function Campo({label,value,onChange,multiline,placeholder,editando}){
  return(
    <div style={{marginBottom:16}}>
      <label className="field-label">{label}</label>
      {editando
        ? multiline
          ? <textarea value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} rows={3} className="field-textarea"/>
          : <input value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} className="field-input"/>
        : <p className="field-value">{value||<span className="field-empty">—</span>}</p>
      }
    </div>
  );
}

function Ficha({cancion,onSave,onBack,onDelete}){
  const[data,setData]=useState({...cancion});
  const[editando,setEditando]=useState(!cancion.nombre);
  const[newI,setNewI]=useState("");
  const[confirm,setConfirm]=useState(false);
  const[guitalele,setGuitalele]=useState(false);
  const set=(k,v)=>setData(d=>({...d,[k]:v}));
  const toggleI=i=>set("instrumentos",data.instrumentos.includes(i)?data.instrumentos.filter(x=>x!==i):[...data.instrumentos,i]);
  const guardarCambios=()=>{onSave(data);setEditando(false);};
  const letraVista=guitalele?transponerTexto(data.letra,5):data.letra;
  const extras=data.instrumentos.filter(i=>!TODOS_INSTR.includes(i));

  const getEmbed=url=>{
    if(!url)return null;
    if(url.includes("bandlab.com")){const m=url.match(/bandlab\.com\/[^/]+\/([a-zA-Z0-9_-]+)/);return m?`https://www.bandlab.com/embed/?id=${m[1]}`:null;}
    if(url.includes("soundcloud.com"))return`https://w.soundcloud.com/player/?url=${encodeURIComponent(url)}&color=%23ff7700&auto_play=false&hide_related=true&show_comments=false`;
    if(url.includes("youtube.com")||url.includes("youtu.be")){const v=url.match(/(?:v=|youtu\.be\/)([^&?/]+)/)?.[1];return v?`https://www.youtube.com/embed/${v}`:null;}
    return null;
  };
  const embedUrl=getEmbed(data.audioUrl);

  return(
    <div className="app">
      <div className="ficha-header">
        <div className="ficha-header-inner">
          <button className="btn-back" onClick={onBack}>←</button>
          <div className="ficha-header-text">
            <h1>{data.nombre||"Nueva canción"}</h1>
            <span className={BADGE[data.estado]}>{data.estado}</span>
          </div>
          {editando
            ? <button className="btn-save" onClick={guardarCambios}>Guardar</button>
            : <button className="btn-edit" onClick={()=>setEditando(true)}>Editar</button>
          }
        </div>
      </div>

      <div className="content">
        {/* Datos básicos */}
        <div className="ficha-section">
          {editando?(
            <div>
              <div className="ficha-grid full" style={{marginBottom:10}}>
                <div><label className="field-label">Nombre</label>
                  <input value={data.nombre} onChange={e=>set("nombre",e.target.value)} placeholder="Nombre de la canción" className="field-input"/></div>
              </div>
              <div className="ficha-grid">
                <div><label className="field-label">Estado</label>
                  <select value={data.estado} onChange={e=>set("estado",e.target.value)} className="field-select">
                    {ESTADOS.map(e=><option key={e}>{e}</option>)}
                  </select></div>
                <div><label className="field-label">Estilo</label>
                  <input value={data.estilo} onChange={e=>set("estilo",e.target.value)} placeholder="Cumbia, balada..." className="field-input"/></div>
                <div><label className="field-label">Tempo</label>
                  <input value={data.tempo} onChange={e=>set("tempo",e.target.value)} placeholder="90 BPM" className="field-input"/></div>
                <div><label className="field-label">Tonalidad</label>
                  <input value={data.tonalidad} onChange={e=>set("tonalidad",e.target.value)} placeholder="Am, G..." className="field-input"/></div>
              </div>
            </div>
          ):(
            <div className="stats-row">
              {[["🎵 Estilo",data.estilo],["⏱ Tempo",data.tempo],["🎼 Tonalidad",data.tonalidad]].map(([l,v])=>(
                <div key={l} className="stat-item">
                  <div className="stat-label">{l}</div>
                  <div className="stat-val">{v||"—"}</div>
                </div>
              ))}
            </div>
          )}
        </div>

        {/* Instrumentos */}
        <div style={{marginBottom:16}}>
          <label className="field-label">Instrumentos acordados</label>
          {editando?(
            <div>
              {Object.entries(CATS).map(([cat,instrs])=>(
                <div key={cat}>
                  <p className="instr-cat">{cat}</p>
                  <div className="instr-tags">
                    {instrs.map(i=>(
                      <button key={i} onClick={()=>toggleI(i)} className={`instr-btn${data.instrumentos.includes(i)?" active":""}`}>{i}</button>
                    ))}
                  </div>
                </div>
              ))}
              {extras.length>0&&(
                <div>
                  <p className="instr-cat">Otros</p>
                  <div className="instr-tags">
                    {extras.map(i=><button key={i} onClick={()=>toggleI(i)} className="instr-btn active">{i}</button>)}
                  </div>
                </div>
              )}
              <div className="instr-add-row">
                <input placeholder="Otro instrumento..." value={newI} onChange={e=>setNewI(e.target.value)}
                  onKeyDown={e=>{if(e.key==="Enter"&&newI.trim()){toggleI(newI.trim());setNewI("");}}}/>
                <button onClick={()=>{if(newI.trim()){toggleI(newI.trim());setNewI("");}}}>+</button>
              </div>
            </div>
          ):data.instrumentos.length>0?(
            <div className="instr-tags">{data.instrumentos.map(i=><span key={i} className="tag">{i}</span>)}</div>
          ):<span className="field-empty">Sin definir</span>}
        </div>

        <hr className="divider"/>

        {/* Letra */}
        <div style={{marginBottom:16}}>
          <div className="letra-header">
            <label className="field-label" style={{margin:0}}>Letra y acordes</label>
            {!editando&&(
              <button onClick={()=>setGuitalele(g=>!g)} className={`btn-modo${guitalele?" active":""}`}>
                {guitalele?"🎵 Guitalele":"🎸 Guitarra"}
              </button>
            )}
          </div>
          <div style={{marginTop:8}}>
            {editando?<EditorLetra value={data.letra} onChange={v=>set("letra",v)}/>:<LetraCifrada texto={letraVista}/>}
          </div>
        </div>

        <hr className="divider"/>

        {/* Audio */}
        <div style={{marginBottom:16}}>
          <label className="field-label">Audio de referencia</label>
          {editando&&(
            <input value={data.audioUrl} onChange={e=>set("audioUrl",e.target.value)}
              placeholder="Link de BandLab, YouTube o SoundCloud..." className="field-input" style={{marginBottom:8}}/>
          )}
          {embedUrl
            ? <iframe src={embedUrl} className="audio-iframe" allow="autoplay" title="audio"/>
            : !editando&&<p className="field-empty">Sin audio cargado</p>
          }
        </div>

        <hr className="divider"/>
        <Campo label="¿Qué falta para terminarla?" value={data.queFalta} onChange={v=>set("queFalta",v)} multiline placeholder="Lo que falta antes de darla por terminada..." editando={editando}/>
        <hr className="divider"/>
        <Campo label="Notas del último ensayo" value={data.notasEnsayo} onChange={v=>set("notasEnsayo",v)} multiline placeholder="Ideas, acuerdos, cosas pendientes..." editando={editando}/>

        {editando&&<button className="btn-guardar-big" onClick={guardarCambios}>Guardar ficha</button>}

        <div className="eliminar-zone">
          {confirm?(
            <div className="confirm-box">
              <p>¿Eliminar "{data.nombre}" definitivamente?</p>
              <div className="confirm-row">
                <button className="btn-confirm-yes" onClick={()=>onDelete(data.id)}>Sí, eliminar</button>
                <button className="btn-confirm-no" onClick={()=>setConfirm(false)}>Cancelar</button>
              </div>
            </div>
          ):<button className="btn-eliminar" onClick={()=>setConfirm(true)}>Eliminar esta canción</button>}
        </div>
      </div>
    </div>
  );
}

function App(){
  const[canciones,setCanciones]=useState(null);
  const[selected,setSelected]=useState(null);
  const[showNueva,setShowNueva]=useState(false);
  const[nombreNueva,setNombreNueva]=useState("");
  const[filtro,setFiltro]=useState("Todas");

  useEffect(()=>{setCanciones(cargar("salita-gh-v2",DEFAULT));},[]);
  useEffect(()=>{if(canciones)guardar("salita-gh-v2",canciones);},[canciones]);

  const saveSong=u=>{setCanciones(p=>p.map(c=>c.id===u.id?u:c));setSelected(u);};
  const deleteSong=id=>{setCanciones(p=>p.filter(c=>c.id!==id));setSelected(null);};
  const crear=()=>{
    if(!nombreNueva.trim())return;
    const n={...FICHA_VACIA,id:Date.now(),nombre:nombreNueva};
    setCanciones(p=>[...p,n]);setNombreNueva("");setShowNueva(false);setSelected(n);
  };

  if(!canciones)return<div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"#fffbf0"}}><div style={{textAlign:"center"}}><div style={{fontSize:48}}>🪗</div><p style={{color:"#92400e",fontWeight:600,marginTop:8}}>Cargando...</p></div></div>;
  if(selected)return<Ficha cancion={selected} onSave={saveSong} onBack={()=>setSelected(null)} onDelete={deleteSong}/>;

  const filtradas=filtro==="Todas"?canciones:canciones.filter(c=>c.estado===filtro);

  return(
    <div className="app">
      <div className="header">
        <div className="header-inner">
          <div className="header-emoji">🪗</div>
          <h1>Salita de Ensayo</h1>
          <p>Modesto Chaleca</p>
        </div>
      </div>
      <div className="content">
        <div className="filtros">
          {["Todas",...ESTADOS].map(e=>(
            <button key={e} onClick={()=>setFiltro(e)} className={`filtro-btn${filtro===e?" active":""}`}>
              {e}{e!=="Todas"&&` (${canciones.filter(c=>c.estado===e).length})`}
            </button>
          ))}
        </div>
        {showNueva?(
          <div className="nueva-input-row">
            <input autoFocus placeholder="Nombre de la canción..." value={nombreNueva}
              onChange={e=>setNombreNueva(e.target.value)} onKeyDown={e=>e.key==="Enter"&&crear()}/>
            <button className="btn-crear" onClick={crear}>Crear</button>
            <button className="btn-cancelar" onClick={()=>setShowNueva(false)}>✕</button>
          </div>
        ):<button className="btn-new" onClick={()=>setShowNueva(true)}>+ Nueva canción</button>}
        {filtradas.length===0&&<p className="empty-msg">No hay canciones en este estado.</p>}
        {filtradas.map(c=>(
          <div key={c.id} className="song-card" onClick={()=>setSelected(c)}>
            <div className="song-card-top">
              <h3>{c.nombre}</h3>
              <span className={BADGE[c.estado]}>{c.estado}</span>
            </div>
            <div className="song-meta">
              {c.estilo&&<span>🎵 {c.estilo}</span>}
              {c.tempo&&<span>⏱ {c.tempo}</span>}
              {c.tonalidad&&<span>🎼 {c.tonalidad}</span>}
            </div>
            {c.instrumentos.length>0&&(
              <div className="tags">
                {c.instrumentos.slice(0,4).map(i=><span key={i} className="tag">{i}</span>)}
                {c.instrumentos.length>4&&<span style={{fontSize:12,color:"#9ca3af",padding:"3px 4px"}}>+{c.instrumentos.length-4} más</span>}
              </div>
            )}
            {c.queFalta&&<p className="song-falta">⚠️ {c.queFalta}</p>}
          </div>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
