<script type="text/babel">
const {useState,useEffect,useRef}=React;

// ── Transposición ──
const NOTAS=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const ALIAS={"Db":"C#","Eb":"D#","Gb":"F#","Ab":"G#","Bb":"A#"};
function trAcorde(a,st){
  const m=a.match(/^([A-G][b#]?)(.*)$/);
  if(!m)return a;
  const base=ALIAS[m[1]]||m[1];
  const idx=NOTAS.indexOf(base);
  if(idx<0)return a;
  return NOTAS[((idx+st)%12+12)%12]+m[2];
}
function trTexto(txt,st){
  if(!txt)return "";
  return txt.replace(/\[([^\]]+)\]/g,(_,a)=>`[${trAcorde(a,st)}]`);
}

// ── Parser cancionero ──
function parsearLetra(texto){
  if(!texto)return[];
  const lineas=texto.split("\n");
  const bloques=[];
  let bloque=[];
  const flush=()=>{if(bloque.length){bloques.push([...bloque]);bloque=[];}};
  for(const lin of lineas){
    if(!lin.trim()){flush();continue;}
    if(/^(coro|estrofa|puente|intro|outro|verso|pre.?coro)/i.test(lin.trim())&&!lin.includes("[")){
      bloque.push({tipo:"seccion",txt:lin.trim()});
      continue;
    }
    if(lin.includes("[")){
      let acordesStr="";let textoStr="";let i=0;
      while(i<lin.length){
        if(lin[i]==="["){
          const fin=lin.indexOf("]",i);
          if(fin>-1){
            const acorde=lin.slice(i+1,fin);
            while(acordesStr.length<textoStr.length)acordesStr+=" ";
            acordesStr+=acorde;
            i=fin+1;
          } else i++;
        } else {textoStr+=lin[i];i++;}
      }
      bloque.push({tipo:"linea",acordes:acordesStr,texto:textoStr});
    } else {
      bloque.push({tipo:"linea",acordes:"",texto:lin});
    }
  }
  flush();
  return bloques;
}

function Cancionero({texto,st}){
  const txtTr=trTexto(texto,st);
  const bloques=parsearLetra(txtTr);
  if(!bloques.length){
    return <p style={{color:"#6b7280",fontStyle:"italic"}}>Sin letra cargada</p>;
  }
  return (
    <div className="cancionero">
      {bloques.map((bloque,bi)=>(
        <div key={bi} className="c-bloque">
          {bloque.map((lin,li)=>{
            if(lin.tipo==="seccion"){
              return <span key={li} className="c-seccion">{lin.txt}</span>;
            }
            return (
              <span key={li} className="c-par">
                <span className="c-acordes">{lin.acordes||" "}</span>
                <span className="c-texto">{lin.texto||" "}</span>
              </span>
            );
          })}
        </div>
      ))}
    </div>
  );
}

function LetraFullScreen({cancion,onClose}){
  const[st,setSt]=useState(0);
  const[playing,setPlaying]=useState(false);
  const[speed,setSpeed]=useState(3);
  const bodyRef=useRef(null);
  const rafRef=useRef(null);
  const subir=()=>setSt(s=>s+1);
  const bajar=()=>setSt(s=>s-1);
  const reset=()=>setSt(0);
  const toggleGuitalele=()=>setSt(s=>s===5?0:5);

  useEffect(()=>{
    if(playing){
      const step=()=>{
        if(bodyRef.current){
          bodyRef.current.scrollTop+=speed*0.4;
          const{scrollTop,scrollHeight,clientHeight}=bodyRef.current;
          if(scrollTop+clientHeight>=scrollHeight-10){setPlaying(false);return;}
        }
        rafRef.current=requestAnimationFrame(step);
      };
      rafRef.current=requestAnimationFrame(step);
    } else {
      if(rafRef.current)cancelAnimationFrame(rafRef.current);
    }
    return()=>{if(rafRef.current)cancelAnimationFrame(rafRef.current);};
  },[playing,speed]);

  const handleTouch=()=>{if(playing)setPlaying(false);};

  return(
    <div className="letra-fs">
      <div className="letra-fs-header">
        <button onClick={onClose} style={{background:"none",color:"#fcd34d",fontSize:22,padding:"0 4px"}}>✕</button>
        <h2>{cancion.nombre}</h2>
      </div>
      <div className="letra-fs-body" ref={bodyRef} onTouchStart={handleTouch}>
        <Cancionero texto={cancion.letra||""} st={st}/>
        <div style={{height:120}}/>
      </div>
      <div className="scroll-controls">
        <button className={`btn-scroll-play${playing?" playing":""}`} onClick={()=>setPlaying(p=>!p)}>
          {playing?"⏸ Pausar":"▶ Auto-scroll"}
        </button>
        <span className="scroll-speed-label">Vel:</span>
        <button className="btn-speed" onClick={()=>setSpeed(s=>Math.max(1,s-1))}>−</button>
        <span className="scroll-speed-val">{speed}</span>
        <button className="btn-speed" onClick={()=>setSpeed(s=>Math.min(10,s+1))}>+</button>
      </div>
      <div className="letra-fs-controls">
        <span className="transp-label">Tono:</span>
        <button className="btn-transp" onClick={bajar}>−</button>
        <span className="transp-val">{st>0?`+${st}`:st}</span>
        <button className="btn-transp" onClick={subir}>+</button>
        <button className="btn-reset" onClick={reset}>0</button>
        <button className={`btn-guitalele${st===5?" on":""}`} onClick={toggleGuitalele}>
          {st===5?"🎵 Guitalele":"🎸 Guitarra"}
        </button>
      </div>
    </div>
  );
}

function EditorLetra({value,onChange}){
  const[ac,setAc]=useState("");
  const ins=()=>{
    if(!ac.trim())return;
    const ta=document.getElementById("eta");if(!ta)return;
    const p=ta.selectionStart;
    onChange(value.slice(0,p)+`[${ac.trim()}]`+value.slice(p));
    setAc("");
    setTimeout(()=>{ta.focus();ta.selectionStart=ta.selectionEnd=p+ac.trim().length+2;},0);
  };
  return(<div>
    <div className="acorde-bar">
      <span>Insertar acorde:</span>
      <input value={ac} onChange={e=>setAc(e.target.value)} onKeyDown={e=>e.key==="Enter"&&ins()} placeholder="Am, G7..." maxLength={6}/>
      <button onClick={ins}>↵</button>
    </div>
    <p className="acorde-hint">Posiciona el cursor en la sílaba y presiona ↵.</p>
    <textarea id="eta" value={value} onChange={e=>onChange(e.target.value)} rows={12}
      placeholder={"[Am]Cuando la [G]lluvia ca[Dm]yó\n[F]ejemplo de letra cifrada"}
      className="field-textarea" style={{fontFamily:"monospace",fontSize:13}}/>
  </div>);
}

function Campo({label,value,onChange,multiline,placeholder,editando}){
  return(<div style={{marginBottom:16}}>
    <label className="field-label">{label}</label>
    {editando
      ?multiline
        ?<textarea value={value||""} onChange={e=>onChange(e.target.value)} placeholder={placeholder} rows={3} className="field-textarea"/>
        :<input value={value||""} onChange={e=>onChange(e.target.value)} placeholder={placeholder} className="field-input"/>
      :<p className="field-value">{value||<span className="field-empty">—</span>}</p>}
  </div>);
}

const ESTADOS=["Idea","En desarrollo","Casi lista","Terminada"];
const BADGE={"Idea":"badge badge-idea","En desarrollo":"badge badge-dev","Casi lista":"badge badge-almost","Terminada":"badge badge-done"};
const CATS={
  "Voces":["Voz principal","Segunda voz"],
  "Cuerdas":["Guitarra de palo","Guitarra eléctrica","Guitalele","Ukelele"],
  "Bajos":["Bajo","Ubass"],
  "Teclados / Viento":["Teclado","Acordeón"],
  "Percusión":["Cajón peruano","Batería tradicional","Jamblock","Cencerro","Djembe","Bongo","Conga"]
};
const TODOS=Object.values(CATS).flat();
const EMPTY={nombre:"",estado:"Idea",estilo:"",tempo:"",tonalidad:"",instrumentos:[],letra:"",audioUrl:"",queFalta:"",notasEnsayo:"",grabacion:{},matriz:null,post:{}};

// ── Producción: Estado de grabación ──
const ESTADOS_G=["pendiente","referencia","final"];
const LABELS_G={"pendiente":"Pendiente","referencia":"Referencia","final":"Final"};

function EstadoGrabacion({instrumentos,grabacion,onChange}){
  if(!instrumentos||instrumentos.length===0)return<p className="field-empty">Agrega instrumentos arriba para registrar su estado de grabación.</p>;
  return(
    <div>
      {instrumentos.map(inst=>{
        const actual=grabacion?.[inst]||"pendiente";
        return(
          <div key={inst} className="estado-row">
            <span className="nombre">{inst}</span>
            <div className="estado-btns">
              {ESTADOS_G.map(e=>(
                <button key={e} className={`estado-btn ${e}${actual===e?" active":""}`} onClick={()=>onChange(inst,e)}>{LABELS_G[e]}</button>
              ))}
            </div>
          </div>
        );
      })}
    </div>
  );
}

// ── Producción: Post-producción ──
const POST_ETAPAS=["Mezcla","Masterizado","Arte/Portada","Distribución"];
const POST_ESTADOS=["pendiente","proceso","listo"];
const POST_LABELS={"pendiente":"Pendiente","proceso":"En proceso","listo":"Listo"};

function PostProduccion({post,onChange}){
  return(
    <div>
      {POST_ETAPAS.map(etapa=>{
        const actual=post?.[etapa]||"pendiente";
        return(
          <div key={etapa} className="estado-row">
            <span className="nombre">{etapa}</span>
            <div className="estado-btns">
              {POST_ESTADOS.map(e=>(
                <button key={e} className={`estado-btn ${e}${actual===e?" active":""}`} onClick={()=>onChange(etapa,e)}>{POST_LABELS[e]}</button>
              ))}
            </div>
          </div>
        );
      })}

// ── Producción: Matriz de arreglos ──
const SECCIONES_DEFAULT=["Intro","Estrofa","Coro","Estrofa","Coro","Salida"];
const FILAS_DEFAULT_BASE=["Voz principal","Guitarra de palo","Bajo"];

function MatrizArreglos({matriz,onChange}){
  const m=matriz||{cols:[...SECCIONES_DEFAULT],rows:[...FILAS_DEFAULT_BASE],cells:{}};
  const setCol=(i,val)=>{const cols=[...m.cols];cols[i]=val;onChange({...m,cols});};
  const setRow=(i,val)=>{const rows=[...m.rows];rows[i]=val;onChange({...m,rows});};
  const addCol=()=>onChange({...m,cols:[...m.cols,"Nueva"]});
  const rmCol=()=>{
    if(m.cols.length<=1)return;
    const idx=m.cols.length-1;
    const cols=m.cols.slice(0,-1);
    const cells={...m.cells};
    Object.keys(cells).forEach(k=>{if(k.endsWith(`-${idx}`))delete cells[k];});
    onChange({...m,cols,cells});
  };
  const addRow=()=>onChange({...m,rows:[...m.rows,"Nuevo instrumento"]});
  const rmRow=()=>{
    if(m.rows.length<=1)return;
    const idx=m.rows.length-1;
    const rows=m.rows.slice(0,-1);
    const cells={...m.cells};
    Object.keys(cells).forEach(k=>{if(k.startsWith(`${idx}-`))delete cells[k];});
    onChange({...m,rows,cells});
  };
  const toggle=(ri,ci)=>{
    const key=`${ri}-${ci}`;
    const cells={...m.cells};
    if(cells[key])delete cells[key];else cells[key]=true;
    onChange({...m,cells});
  };
  return(
    <div>
      <div className="matriz-wrap">
        <table className="matriz">
          <thead>
            <tr>
              <th className="row-label">Instrumento</th>
              {m.cols.map((c,ci)=>(
                <th key={ci}><input className="col-input" value={c} onChange={e=>setCol(ci,e.target.value)}/></th>
              ))}
            </tr>
          </thead>
          <tbody>
            {m.rows.map((r,ri)=>(
              <tr key={ri}>
                <td className="row-label"><input className="row-input" value={r} onChange={e=>setRow(ri,e.target.value)}/></td>
                {m.cols.map((c,ci)=>(
                  <td key={ci}>
                    <div className={`matriz-cell${m.cells[`${ri}-${ci}`]?" on":""}`} onClick={()=>toggle(ri,ci)}/>
                  </td>
                ))}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <div className="matriz-actions">
        <button className="btn-matriz-add" onClick={addCol}>+ Sección</button>
        <button className="btn-matriz-rm" onClick={rmCol}>− Sección</button>
        <button className="btn-matriz-add" onClick={addRow}>+ Instrumento</button>
        <button className="btn-matriz-rm" onClick={rmRow}>− Instrumento</button>
      </div>
    </div>
  );
}

// ── Cálculos de progreso ──
function calcPct(instr,grab){
  if(!instr||instr.length===0)return 0;
  const f=instr.filter(i=>grab?.[i]==="final").length;
  const r=instr.filter(i=>grab?.[i]==="referencia").length;
  return Math.round(((f+r*0.5)/instr.length)*100);
}
function calcPostPct(post){
  const f=POST_ETAPAS.filter(e=>post?.[e]==="listo").length;
  const r=POST_ETAPAS.filter(e=>post?.[e]==="proceso").length;
  return Math.round(((f+r*0.5)/POST_ETAPAS.length)*100);
}
function barColor(pct){return pct===100?"#22c55e":pct>=50?"#f59e0b":"#ef4444";}

function BarraProgreso({pct,label}){
  const color=barColor(pct);
  return(
    <div className="barra-grande-wrap">
      <div className="barra-grande-top">
        <span style={{fontWeight:600,color:"#1f2937"}}>{label}</span>
        <span style={{fontWeight:700,color}}>{pct}%</span>
      </div>
      <div className="barra-grande-track">
        <div className="barra-grande-fill" style={{width:`${pct}%`,background:color}}/>
      </div>
    </div>
  );
}

function MiniBarra({pct,label,onClick}){
  const color=barColor(pct);
  return(
    <div className="mini-barra-wrap" onClick={onClick}>
      <div className="mini-barra-top">
        <span style={{color:"#6b7280",fontWeight:600}}>{label}</span>
        <span style={{color,fontWeight:700}}>{pct}%</span>
      </div>
      <div className="mini-barra-track">
        <div className="mini-barra-fill" style={{width:`${pct}%`,background:color}}/>
      </div>
    </div>
  );
}

// ── Dashboard ──
function Dashboard({canciones,onOpen}){
  const porInstrumento={};
  canciones.forEach(c=>{
    (c.instrumentos||[]).forEach(inst=>{
      const estado=c.grabacion?.[inst]||"pendiente";
      if(!porInstrumento[inst])porInstrumento[inst]=[];
      porInstrumento[inst].push({nombre:c.nombre,estado});
    });
  });

  const[expandido,setExpandido]=useState({});
  const toggleExp=inst=>setExpandido(p=>({...p,[inst]:!p[inst]}));

  if(canciones.length===0){
    return(
      <div className="content">
        <p className="dash-title">🪗 Estado del Arte</p>
        <p className="dash-sub">Resumen general — Modesto Chaleca</p>
        <p className="empty-msg">Aún no hay canciones. Crea la primera desde la pestaña "Canciones".</p>
      </div>
    );
  }

  return(
    <div className="content">
      <p className="dash-title">🪗 Estado del Arte</p>
      <p className="dash-sub">Resumen general — Modesto Chaleca</p>

      <p className="prod-title">Avance por canción</p>
      {canciones.map(c=>{
        const pctG=calcPct(c.instrumentos,c.grabacion);
        const pctP=calcPostPct(c.post);
        return(
          <div key={c.id} className="dash-card">
            <div className="dash-card-title">{c.nombre}</div>
            <MiniBarra pct={pctG} label="Grabación  →" onClick={()=>onOpen(c)}/>
            <MiniBarra pct={pctP} label="Post-producción  →" onClick={()=>onOpen(c)}/>
          </div>
        );
      })}

      <p className="prod-title" style={{marginTop:20}}>Estado por instrumento</p>
      {Object.entries(porInstrumento).map(([inst,lista])=>{
        const pendientes=lista.filter(l=>l.estado!=="final");
        const finales=lista.filter(l=>l.estado==="final");
        const exp=expandido[inst];
        return(
          <div key={inst} className="dash-card">
            <div className="instr-card-title">🎵 {inst}</div>
            {pendientes.map((l,i)=>(
              <div key={i} className="estado-row" style={{padding:"4px 0"}}>
                <span style={{fontSize:13,color:"#1f2937"}}>{l.nombre}</span>
                <span className={`estado-btn ${l.estado} active`} style={{cursor:"default"}}>{LABELS_G[l.estado]}</span>
              </div>
            ))}
            {finales.length>0&&(
              <div>
                <button className="btn-mostrar-final" onClick={()=>toggleExp(inst)}>
                  {exp?"▲ Ocultar":"▼ Mostrar"} {finales.length} en Final
                </button>
                {exp&&finales.map((l,i)=>(
                  <div key={i} className="estado-row" style={{padding:"4px 0"}}>
                    <span style={{fontSize:13,color:"#1f2937"}}>{l.nombre}</span>
                    <span className="estado-btn final active" style={{cursor:"default"}}>Final</span>
                  </div>
                ))}
              </div>
            )}
            {pendientes.length===0&&!exp&&(
              <p style={{fontSize:12,color:"#22c55e",fontWeight:600,margin:0}}>✓ Todo en Final ({finales.length})</p>
            )}
          </div>
        );
      })}
    </div>
  );
}

// ── Ficha ──
function Ficha({cancion,onSave,onBack,onDelete}){
  const[data,setData]=useState({...EMPTY,...cancion});
  const[editando,setEditando]=useState(!cancion.nombre);
  const[newI,setNewI]=useState("");
  const[confirm,setConfirm]=useState(false);
  const[saving,setSaving]=useState(false);
  const[verLetra,setVerLetra]=useState(false);
  const set=(k,v)=>setData(d=>({...d,[k]:v}));
  const togI=i=>{
    const cur=data.instrumentos||[];
    set("instrumentos",cur.includes(i)?cur.filter(x=>x!==i):[...cur,i]);
  };
  const guardar=async()=>{setSaving(true);await onSave(data);setSaving(false);setEditando(false);};
  const extras=(data.instrumentos||[]).filter(i=>!TODOS.includes(i));
  const getEmbed=url=>{
    if(!url)return null;
    if(url.includes("bandlab.com")){const m=url.match(/bandlab\.com\/[^/]+\/([a-zA-Z0-9_-]+)/);return m?`https://www.bandlab.com/embed/?id=${m[1]}`:null;}
    if(url.includes("soundcloud.com"))return`https://w.soundcloud.com/player/?url=${encodeURIComponent(url)}&color=%23ff7700&auto_play=false&hide_related=true&show_comments=false`;
    if(url.includes("youtube.com")||url.includes("youtu.be")){const v=url.match(/(?:v=|youtu\.be\/)([^&?/]+)/)?.[1];return v?`https://www.youtube.com/embed/${v}`:null;}
    return null;
  };
  const embed=getEmbed(data.audioUrl||"");
  const pctG=calcPct(data.instrumentos,data.grabacion);
  const pctP=calcPostPct(data.post);

  return(
    <div className="app">
      {verLetra&&<LetraFullScreen cancion={data} onClose={()=>setVerLetra(false)}/>}
      <div className="ficha-header">
        <div className="ficha-header-inner">
          <button className="btn-back" onClick={onBack}>←</button>
          <div className="ficha-header-text">
            <h1>{data.nombre||"Nueva canción"}</h1>
            <span className={BADGE[data.estado]||"badge badge-idea"}>{data.estado}</span>
          </div>
          {editando
            ?<button className="btn-save" onClick={guardar} disabled={saving}>{saving?"...":"Guardar"}</button>
            :<button className="btn-edit" onClick={()=>setEditando(true)}>Editar</button>}
        </div>
      </div>
      <div className="content">
        <div className="ficha-section">
          {editando?(
            <div>
              <div style={{marginBottom:10}}>
                <label className="field-label">Nombre</label>
                <input value={data.nombre||""} onChange={e=>set("nombre",e.target.value)} placeholder="Nombre de la canción" className="field-input"/>
              </div>
              <div className="ficha-grid">
                <div><label className="field-label">Estado</label><select value={data.estado||"Idea"} onChange={e=>set("estado",e.target.value)} className="field-select">{ESTADOS.map(e=><option key={e}>{e}</option>)}</select></div>
                <div><label className="field-label">Estilo</label><input value={data.estilo||""} onChange={e=>set("estilo",e.target.value)} placeholder="Cumbia..." className="field-input"/></div>
                <div><label className="field-label">Tempo</label><input value={data.tempo||""} onChange={e=>set("tempo",e.target.value)} placeholder="90 BPM" className="field-input"/></div>
                <div><label className="field-label">Tonalidad</label><input value={data.tonalidad||""} onChange={e=>set("tonalidad",e.target.value)} placeholder="Am, G..." className="field-input"/></div>
              </div>
            </div>
          ):(
            <div className="stats-row">
              {[["🎵 Estilo",data.estilo],["⏱ Tempo",data.tempo],["🎼 Tonalidad",data.tonalidad]].map(([l,v])=>(
                <div key={l} className="stat-item"><div className="stat-label">{l}</div><div className="stat-val">{v||"—"}</div></div>
              ))}
            </div>
          )}
        </div>

        {!editando&&(data.letra||"").trim()&&(
          <button className="btn-ver-letra" onClick={()=>setVerLetra(true)}>🎵 Ver letra y acordes</button>
        )}

        <div className="prod-section">
          <p className="prod-title">Progreso general</p>
          <BarraProgreso pct={pctG} label="Grabación"/>
          <BarraProgreso pct={pctP} label="Post-producción"/>
        </div>

        <div style={{marginBottom:16}}>
          <label className="field-label">Instrumentos</label>
          {editando?(
            <div>
              {Object.entries(CATS).map(([cat,ins])=>(
                <div key={cat}>
                  <p className="instr-cat">{cat}</p>
                  <div className="instr-tags">{ins.map(i=><button key={i} onClick={()=>togI(i)} className={`instr-btn${(data.instrumentos||[]).includes(i)?" active":""}`}>{i}</button>)}</div>
                </div>
              ))}
              {extras.length>0&&<div><p className="instr-cat">Otros</p><div className="instr-tags">{extras.map(i=><button key={i} onClick={()=>togI(i)} className="instr-btn active">{i}</button>)}</div></div>}
              <div className="instr-add-row">
                <input placeholder="Otro instrumento..." value={newI} onChange={e=>setNewI(e.target.value)}
                  onKeyDown={e=>{if(e.key==="Enter"&&newI.trim()){togI(newI.trim());setNewI("");}}}/>
                <button onClick={()=>{if(newI.trim()){togI(newI.trim());setNewI("");}}}>+</button>
              </div>
            </div>
          ):(data.instrumentos||[]).length>0
            ?<div className="instr-tags">{(data.instrumentos||[]).map(i=><span key={i} className="tag">{i}</span>)}</div>
            :<span className="field-empty">Sin definir</span>}
        </div>

        <div className="divider"/>

        {editando&&(
          <div style={{marginBottom:16}}>
            <label className="field-label">Letra y acordes</label>
            <EditorLetra value={data.letra||""} onChange={v=>set("letra",v)}/>
          </div>
        )}

        <div style={{marginBottom:16}}>
          <label className="field-label">Audio de referencia</label>
          {editando&&<input value={data.audioUrl||""} onChange={e=>set("audioUrl",e.target.value)} placeholder="BandLab, YouTube o SoundCloud..." className="field-input" style={{marginBottom:8}}/>}
          {embed?<iframe src={embed} className="audio-iframe" allow="autoplay" title="audio"/>:!editando&&<p className="field-empty">Sin audio cargado</p>}
        </div>

        <div className="divider"/>
        <Campo label="¿Qué falta para terminarla?" value={data.queFalta||""} onChange={v=>set("queFalta",v)} multiline placeholder="Lo que falta antes de darla por terminada..." editando={editando}/>
        <div className="divider"/>
        <Campo label="Notas del último ensayo" value={data.notasEnsayo||""} onChange={v=>set("notasEnsayo",v)} multiline placeholder="Ideas, acuerdos, cosas pendientes..." editando={editando}/>

        {editando&&<button className="btn-guardar-big" onClick={guardar} disabled={saving}>{saving?"Guardando...":"Guardar ficha"}</button>}

        <div className="prod-section">
          <p className="prod-title">Estado de grabación por instrumento</p>
          <EstadoGrabacion instrumentos={data.instrumentos} grabacion={data.grabacion} onChange={(inst,estado)=>{
            const ng={...(data.grabacion||{}),[inst]:estado};
            set("grabacion",ng);
            onSave({...data,grabacion:ng});
          }}/>
        </div>

        <div className="prod-section">
          <p className="prod-title">Post-producción</p>
          <PostProduccion post={data.post} onChange={(etapa,estado)=>{
            const np={...(data.post||{}),[etapa]:estado};
            set("post",np);
            onSave({...data,post:np});
          }}/>
        </div>

        <div className="prod-section">
          <p className="prod-title">Mapa de arreglos (matriz cronológica)</p>
          <MatrizArreglos matriz={data.matriz} onChange={m=>{
            set("matriz",m);
            onSave({...data,matriz:m});
          }}/>
        </div>

        <div className="eliminar-zone">
          {confirm
            ?<div className="confirm-box">
               <p>¿Eliminar "{data.nombre}"?</p>
               <div className="confirm-row">
                 <button className="btn-confirm-yes" onClick={()=>onDelete(data.id)}>Sí, eliminar</button>
                 <button className="btn-confirm-no" onClick={()=>setConfirm(false)}>Cancelar</button>
               </div>
             </div>
            :<button className="btn-eliminar" onClick={()=>setConfirm(true)}>Eliminar esta canción</button>}
        </div>
      </div>
    </div>
  );
}

const SYSTEM=`Eres un asistente para la app "Salita de Ensayo" del grupo Modesto Chaleca.
Extrae información musical y devuelve SOLO un JSON válido con esta estructura exacta, sin texto adicional ni backticks:
{"nombre":"","estado":"Idea","estilo":"","tempo":"","tonalidad":"","instrumentos":[],"letra":"","queFalta":"","notasEnsayo":"","audioUrl":""}
Para la letra usa formato [Acorde]sílaba. Ejemplo: [Am]Cuan[G]do la llu[Dm]via ca[F]yó`;

async function callAI(apiKey,txt){
  const r=await fetch("https://api.openai.com/v1/chat/completions",{
    method:"POST",
    headers:{"Content-Type":"application/json","Authorization":"Bearer "+apiKey},
    body:JSON.stringify({model:"gpt-4o-mini",max_tokens:2000,messages:[{role:"system",content:SYSTEM},{role:"user",content:txt}]})
  });
  const d=await r.json();
  if(d.error)throw new Error(d.error.message);
  return d.choices[0].message.content;
}
function parseJSON(txt){
  try{return JSON.parse(txt.replace(/```json|```/g,"").trim());}catch{return null;}
}

function IAModal({onClose,onCrear,apiKey,setApiKey}){
  const[tab,setTab]=useState("chat");
  const[msgs,setMsgs]=useState([{bot:true,txt:"¡Hola! Cuéntame sobre la canción. Puedes hablar o escribir."}]);
  const[input,setInput]=useState("");
  const[loading,setLoading]=useState(false);
  const[preview,setPreview]=useState(null);
  const[rec,setRec]=useState(false);
  const botRef=useRef(null);
  useEffect(()=>{botRef.current?.scrollIntoView({behavior:"smooth"});},[msgs]);

  const enviar=async(txt)=>{
    if(!txt.trim()||loading)return;
    if(!apiKey){alert("Ingresa tu API Key de OpenAI.");return;}
    setMsgs(p=>[...p,{bot:false,txt},{bot:true,txt:"..."}]);
    setInput("");setLoading(true);
    try{
      const resp=await callAI(apiKey,txt);
      const json=parseJSON(resp);
      setMsgs(p=>[...p.slice(0,-1),{bot:true,txt:json?"✅ Información extraída. Revisa el resumen.":"No pude extraer la info. ¿Puedes dar más detalles?"}]);
      if(json)setPreview(json);
    }catch(e){setMsgs(p=>[...p.slice(0,-1),{bot:true,txt:"Error: "+e.message}]);}
    setLoading(false);
  };

  const procesarTexto=async(txt)=>{
    if(!apiKey){alert("Ingresa tu API Key de OpenAI.");return;}
    setLoading(true);setMsgs([{bot:true,txt:"Procesando archivo..."}]);
    try{
      const resp=await callAI(apiKey,"Extrae la información musical de este texto:\n\n"+txt);
      const json=parseJSON(resp);
      setMsgs([{bot:true,txt:json?"✅ Archivo procesado.":"No pude procesar el archivo."}]);
      if(json)setPreview(json);
    }catch(e){setMsgs([{bot:true,txt:"Error: "+e.message}]);}
    setLoading(false);
  };

  const leerArchivo=async(file)=>{
    setTab("archivo");
    try{
      let txt="";
      if(file.name.endsWith(".pdf")){
        const ab=await file.arrayBuffer();
        const str=new TextDecoder("latin1").decode(new Uint8Array(ab));
        const m=str.match(/BT[\s\S]*?ET/g)||[];
        txt=m.map(b=>{const tj=b.match(/\(([^)]*)\)\s*T[jJ]/g)||[];return tj.map(t=>t.replace(/\(([^)]*)\)\s*T[jJ]/,"$1")).join(" ");}).join("\n").trim();
        if(txt.length<20){const raw=str.match(/\(([^\)]{2,80})\)/g)||[];txt=raw.map(r=>r.slice(1,-1)).filter(r=>/[a-zA-ZáéíóúñÁÉÍÓÚÑ]{3,}/.test(r)).join(" ");}
        if(txt.length<10){setMsgs([{bot:true,txt:"No pude leer el PDF. Exporta como .txt desde Google Docs."}]);return;}
      } else if(file.name.endsWith(".docx")){
        const ab=await file.arrayBuffer();
        const str=new TextDecoder("utf-8",{fatal:false}).decode(new Uint8Array(ab));
        const m=str.match(/<w:t[^>]*>([^<]*)<\/w:t>/g)||[];
        txt=m.length?m.map(x=>x.replace(/<[^>]+>/g,"")).join(" "):str.replace(/<[^>]+>/g," ").replace(/\s+/g," ");
      } else {
        txt=await file.text();
      }
      await procesarTexto(txt);
    }catch(e){setMsgs([{bot:true,txt:"Error: "+e.message}]);}
  };

  const startSpeech=()=>{
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){alert("Usa Chrome para reconocimiento de voz.");return;}
    const r=new SR();r.lang="es-CL";r.continuous=false;r.interimResults=false;
    r.onresult=e=>setInput(p=>(p+" "+e.results[0][0].transcript).trim());
    r.onend=()=>setRec(false);r.onerror=()=>setRec(false);
    r.start();setRec(true);
  };

  return(
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal-sheet">
        <div className="modal-header">
          <span style={{fontSize:24}}>✨</span>
          <h2>Asistente IA</h2>
          <button onClick={onClose} style={{background:"none",color:"white",fontSize:22}}>✕</button>
        </div>
        <div className="modal-body">
          <div className="api-box">
            <label>API Key de OpenAI</label>
            <input type="password" value={apiKey} onChange={e=>setApiKey(e.target.value)} placeholder="sk-..."/>
            <p>platform.openai.com → API Keys</p>
          </div>
          <div className="ia-tabs">
            <button className={`ia-tab${tab==="chat"?" active":""}`} onClick={()=>setTab("chat")}>💬 Chat / Voz</button>
            <button className={`ia-tab${tab==="archivo"?" active":""}`} onClick={()=>setTab("archivo")}>📄 Importar archivo</button>
          </div>
          {tab==="archivo"&&(
            <div className="upload-zone" onClick={()=>document.getElementById("finp").click()}
              onDragOver={e=>e.preventDefault()} onDrop={e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(f)leerArchivo(f);}}>
              <div style={{fontSize:36}}>📄</div>
              <p>Toca para subir un archivo</p>
              <span>.txt · .docx · .pdf</span>
              <input id="finp" type="file" accept=".txt,.docx,.pdf" style={{display:"none"}} onChange={e=>{const f=e.target.files[0];if(f)leerArchivo(f);e.target.value="";}}/>
            </div>
          )}
          {msgs.map((m,i)=><div key={i} className={m.bot?"ia-msg-bot":"ia-msg-user"}>{m.txt}</div>)}
          <div ref={botRef}/>
          {preview&&(
            <div className="preview-box">
              <h3>✅ Canción detectada</h3>
              {[["Nombre",preview.nombre],["Estado",preview.estado],["Estilo",preview.estilo],["Tempo",preview.tempo],["Tonalidad",preview.tonalidad],["Instrumentos",(preview.instrumentos||[]).join(", ")],["Qué falta",preview.queFalta]].filter(([,v])=>v).map(([l,v])=>(
                <div key={l} className="preview-row"><span className="lbl">{l}</span><span style={{color:"#1f2937",fontSize:13}}>{v}</span></div>
              ))}
              {preview.letra&&<div className="preview-row"><span className="lbl">Letra</span><span style={{fontSize:12,color:"#6b7280"}}>{preview.letra.slice(0,80)}…</span></div>}
              <button className="btn-apply" onClick={()=>{onCrear(preview);onClose();}}>➕ Agregar a la Salita</button>
            </div>
          )}
        </div>
        {tab==="chat"&&(
          <div className="modal-footer">
            <div className="ia-input-row">
              <button className={`btn-mic${rec?" rec":""}`} onClick={startSpeech}>{rec?"⏹":"🎤"}</button>
              <textarea value={input} onChange={e=>setInput(e.target.value)} placeholder="Describe la canción..." rows={2}
                onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();enviar(input);}}}/>
              <button className="btn-send" onClick={()=>enviar(input)} disabled={loading}>➤</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ── App principal ──
function App(){
  const[canciones,setCanciones]=useState(null);
  const[selected,setSelected]=useState(null);
  const[vista,setVista]=useState("dashboard"); // dashboard | lista
  const[showNueva,setShowNueva]=useState(false);
  const[showIA,setShowIA]=useState(false);
  const[nombreNueva,setNombreNueva]=useState("");
  const[filtro,setFiltro]=useState("Todas");
  const[syncing,setSyncing]=useState(false);
  const[apiKey,setApiKey]=useState(()=>{try{return localStorage.getItem("oai-key")||"";}catch{return "";}});
  useEffect(()=>{try{if(apiKey)localStorage.setItem("oai-key",apiKey);}catch{}},[apiKey]);

  useEffect(()=>{
    const unsub=db.collection("canciones").orderBy("createdAt","asc").onSnapshot(
      snap=>{setCanciones(snap.docs.map(d=>({id:d.id,...d.data()})));},
      ()=>setCanciones([])
    );
    return()=>unsub();
  },[]);

  const saveSong=async(u)=>{
    setSyncing(true);
    try{
      const{id,...rest}=u;
      const clean=Object.fromEntries(Object.entries(rest).filter(([,v])=>v!==undefined));
      await db.collection("canciones").doc(String(id)).set({...clean,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
      setSelected({...u});
    }catch(e){console.error(e);}
    setSyncing(false);
  };

  const deleteSong=async(id)=>{
    setSyncing(true);
    try{await db.collection("canciones").doc(String(id)).delete();}catch(e){console.error(e);}
    setSelected(null);setSyncing(false);
  };

  const crearManual=async(nombre)=>{
    if(!nombre.trim())return;
    setSyncing(true);
    try{
      const n={...EMPTY,nombre,createdAt:firebase.firestore.FieldValue.serverTimestamp()};
      const ref=await db.collection("canciones").add(n);
      setNombreNueva("");setShowNueva(false);
      setSelected({id:ref.id,...EMPTY,nombre});
    }catch(e){console.error(e);}
    setSyncing(false);
  };

  const crearDesdeIA=async(data)=>{
    setSyncing(true);
    try{
      const n={
        nombre:data.nombre||"Sin nombre",
        estado:data.estado||"Idea",
        estilo:data.estilo||"",
        tempo:data.tempo||"",
        tonalidad:data.tonalidad||"",
        instrumentos:Array.isArray(data.instrumentos)?data.instrumentos:[],
        letra:data.letra||"",
        audioUrl:data.audioUrl||"",
        queFalta:data.queFalta||"",
        notasEnsayo:data.notasEnsayo||"",
        grabacion:{},
        matriz:null,
        post:{},
        createdAt:firebase.firestore.FieldValue.serverTimestamp()
      };
      const ref=await db.collection("canciones").add(n);
      const{createdAt,...sinTS}=n;
      setSelected({id:ref.id,...sinTS});
    }catch(e){console.error(e);}
    setSyncing(false);
  };

  if(canciones===null)return(
    <div className="loading">
      <div style={{textAlign:"center"}}>
        <div style={{fontSize:48}}>🪗</div>
        <p style={{color:"#92400e",fontWeight:600,marginTop:8}}>Cargando Salita...</p>
      </div>
    </div>
  );

  if(selected){
    const fresh=canciones.find(c=>c.id===selected.id)||selected;
    return<Ficha cancion={{...EMPTY,...fresh}} onSave={saveSong} onBack={()=>setSelected(null)} onDelete={deleteSong}/>;
  }

  const filtradas=filtro==="Todas"?canciones:canciones.filter(c=>c.estado===filtro);

  return(
    <div className="app">
      {showIA&&<IAModal onClose={()=>setShowIA(false)} onCrear={crearDesdeIA} apiKey={apiKey} setApiKey={setApiKey}/>}
      <div className="header">
        <div className="header-inner">
          <div className="header-emoji">🪗</div>
          <h1>Salita de Ensayo{syncing&&<span className="sync-dot"/>}</h1>
          <p>Modesto Chaleca</p>
        </div>
      </div>
      <div className="content" style={{paddingBottom:0}}>
        <div className="dash-tabs">
          <button className={`dash-tab${vista==="dashboard"?" active":""}`} onClick={()=>setVista("dashboard")}>📊 Estado del Arte</button>
          <button className={`dash-tab${vista==="lista"?" active":""}`} onClick={()=>setVista("lista")}>🎵 Canciones</button>
        </div>
      </div>

      {vista==="dashboard"&&<Dashboard canciones={canciones} onOpen={c=>setSelected(c)}/>}

      {vista==="lista"&&(
        <div className="content">
          <div className="filtros">
            {["Todas",...ESTADOS].map(e=>(
              <button key={e} onClick={()=>setFiltro(e)} className={`filtro-btn${filtro===e?" active":""}`}>
                {e}{e!=="Todas"&&` (${canciones.filter(c=>c.estado===e).length})`}
              </button>
            ))}
          </div>
          <button className="btn-ia" onClick={()=>setShowIA(true)}>✨ Agregar canción con IA</button>
          {showNueva?(
            <div className="nueva-input-row">
              <input autoFocus placeholder="Nombre de la canción..." value={nombreNueva}
                onChange={e=>setNombreNueva(e.target.value)}
                onKeyDown={e=>e.key==="Enter"&&crearManual(nombreNueva)}/>
              <button className="btn-crear" onClick={()=>crearManual(nombreNueva)}>Crear</button>
              <button className="btn-cancelar" onClick={()=>setShowNueva(false)}>✕</button>
            </div>
          ):<button className="btn-new" onClick={()=>setShowNueva(true)}>+ Nueva canción (manual)</button>}
          {filtradas.length===0&&<p className="empty-msg">{canciones.length===0?"¡Aún no hay canciones!":"No hay canciones en este estado."}</p>}
          {filtradas.map(c=>(
            <div key={c.id} className="song-card" onClick={()=>setSelected(c)}>
              <div className="song-card-top">
                <h3>{c.nombre}</h3>
                <span className={BADGE[c.estado]||"badge badge-idea"}>{c.estado}</span>
              </div>
              <div className="song-meta">
                {c.estilo&&<span>🎵 {c.estilo}</span>}
                {c.tempo&&<span>⏱ {c.tempo}</span>}
                {c.tonalidad&&<span>🎼 {c.tonalidad}</span>}
              </div>
              {(c.instrumentos||[]).length>0&&(
                <div className="tags">
                  {(c.instrumentos||[]).slice(0,4).map(i=><span key={i} className="tag">{i}</span>)}
                  {(c.instrumentos||[]).length>4&&<span style={{fontSize:12,color:"#9ca3af",padding:"3px 4px"}}>+{c.instrumentos.length-4} más</span>}
                </div>
              )}
              {c.queFalta&&<p className="song-falta">⚠️ {c.queFalta}</p>}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
